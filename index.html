
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made by Malek Elnhas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Tahoma, sans-serif;
  background: radial-gradient(circle at top, #123c78, #061329 65%, #020711);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 550px;
  padding: 35px 20px;
  text-align: center;
  border: 1px solid #168cff;
  border-radius: 25px;
  background: rgba(5, 20, 45, 0.9);
  box-shadow: 0 0 35px #0875ff55;
  animation: appear 1s ease;
}

h1 {
  color: #e5f6ff;
  font-size: clamp(25px, 7vw, 38px);
  text-shadow: 0 0 15px #168cff, 0 0 30px #168cff;
}

p {
  color: #a9d9ff;
  font-size: 16px;
  margin: 25px 0;
}

button {
  border: none;
  border-radius: 30px;
  padding: 15px 32px;
  background: linear-gradient(135deg, #0875ff, #18c7ff);
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 25px #168cff66;
}

button:active {
  transform: scale(0.95);
}

#surprise {
  display: none;
  margin-top: 25px;
  animation: appear 0.7s ease;
}

#surprise img {
  width: 100%;
  height: auto;
  border: 2px solid #39baff;
  border-radius: 18px;
  box-shadow: 0 0 25px #168cff66;
}

#surprise.show {
  display: block;
}

.footer {
  margin-top: 30px;
  color: #78a9d8;
  font-size: 12px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>Made by Malek Elnhas</h1>

  <p>✨ جاهز تشوف المفاجأة؟ ✨</p>

  <button id="revealButton" onclick="showSurprise()">
    دوس هنا 👀
  </button>

  <div id="surprise">
    <img
      src="malek-photo.jpeg"
      alt="المفاجأة"
    >
    <p>😂😂 اتقفشتوا!</p>
  </div>

  <div class="footer">
    BLUE EDITION 💙
  </div>

</div>

<script>
function showSurprise() {
  const surprise = document.getElementById("surprise");
  const button = document.getElementById("revealButton");

  surprise.classList.toggle("show");

  if (surprise.classList.contains("show")) {
    button.textContent = "خبّي الصورة 🙈";
  } else {
    button.textContent = "دوس هنا 👀";
  }
}
</script>

</body>
</html>
